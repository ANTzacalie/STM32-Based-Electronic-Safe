[env:genericSTM32F103CB]
platform = ststm32
board = genericSTM32F103CB
framework = stm32cube

; Programare si debugging prin ST-Link V2.
upload_protocol = stlink
debug_tool = stlink

; Compilare pentru debugging.
build_type = debug

; Folosim scriptul de linker local in care impartim si rezervam din memoria microcontrollerului, obligatoriu pentr ca paginile 127 si 128 sa nu fie ocupate de linker.
board_build.ldscript = linker_mem.ld

; Limita firmware-ului: 126 KB = 129024 octeti, limiteaza spariul maxim care poate fi utilizat de firmware, pentru ca lam redus cu doua pagini.
board_upload.maximum_size = 129024
